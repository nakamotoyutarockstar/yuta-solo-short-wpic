
<script>
const songImages = {
  "LAST SONG": "assets/yuta-last-song.jpg",
  "Off The Mask": "assets/yuta-off-the-mask.jpg",
  "Save You": "assets/yuta-save-you.jpg",
  "BAD EUPHORIA": "assets/yuta-bad-euphoria.jpg",
  "PRISONER": "assets/yuta-prisoner.jpg",
  "Goodbye": "assets/yuta-goodbye.jpg",
  "Butterfly": "assets/yuta-butterfly.jpg",
  "TWISTED PARADISE": "assets/yuta-twisted-paradise.jpg",
  "When I'm Not Around": "assets/yuta-when-im-not-around.jpg",
  "New World": "assets/yuta-new-world.jpg",
  "EMBER": "assets/yuta-ember.jpg",
  "Two Of Us": "assets/yuta-two-of-us.jpg",
  "Get Out Of My Mind": "assets/yuta-get-out-of-my-mind.jpg",
  "KNOCK KNOCK": "assets/yuta-knock-knock.jpg",
  "If We Lose It All Tonight": "assets/yuta-if-we-lose-it-all-tonight.jpg",
  "Possiboo-Hoo": "assets/yuta-possiboo-hoo.jpg",
  "TO LOVE SOMEONE": "assets/yuta-to-love-someone.jpg",
  "PLAY BACK": "assets/yuta-play-back.jpg",
  "Dreams Never Sleep": "assets/yuta-dreams-never-sleep.jpg"
};

const songs = Object.keys(songImages);

const youtubeLinks = {
  "LAST SONG": "https://youtu.be/IGX_xXsP_Pg",
  "Off The Mask": "https://youtu.be/-oqEUl4e9kM",
  "Save You": "https://youtu.be/Y3KdXMvWGVI",
  "BAD EUPHORIA": "https://youtu.be/D2FxfTQDN3s",
  "PRISONER": "https://youtu.be/pxjvPEKApg8",
  "Goodbye": "https://youtu.be/NN_Q1ElAqlk",
  "Butterfly": "https://youtu.be/_CK0JMq-kNQ",
  "TWISTED PARADISE": "https://youtu.be/REvRiHwfUqg",
  "When I'm Not Around": "https://youtu.be/4VSGdRzOjXk",
  "New World": "https://youtu.be/x_cxvMnx-s4",
  "EMBER": "https://youtu.be/swjKSuDhc6c",
  "Two Of Us": "https://youtu.be/XcRBBetHRd0",
  "Get Out Of My Mind": "https://youtu.be/9hqoZekP5uY",
  "KNOCK KNOCK": "https://youtu.be/JA2VgsXvyTY",
  "If We Lose It All Tonight": "https://youtu.be/UsX2uNAbRKs",
  "Possiboo-Hoo": "https://youtu.be/_-ubSxa0OAU",
  "TO LOVE SOMEONE": "https://youtu.be/ZXx0q7yijCQ",
  "PLAY BACK": "https://youtu.be/014qSQcX3CE",
  "Dreams Never Sleep": "https://youtu.be/9nOX0zxrLfw"
};

const TOTAL_MATCHUPS = 62;
const $ = id => document.getElementById(id);

let ratings = {};
let appearances = {};
let match = 0;
let a = null;
let b = null;

// MUSIC PLAYER
const bgMusic = $("yuta-background");
const winnerMusic = $("yuta-winner");
const musicToggle = $("music-toggle");
const musicIcon = $("music-icon");
const musicLabel = $("music-label");
const musicTrackLabel = $("music-track-label");

let musicEnabled = false;
let winnerTrackActive = false;
let musicGeneration = 0;

function updateMusicButton(playing, status) {
  musicIcon.textContent = playing ? "Ⅱ" : "▶";
  musicLabel.textContent = playing ? "Pause music" : "Play music";
  musicToggle.setAttribute("aria-pressed", String(playing));
  musicTrackLabel.textContent = status;
}

async function playBackgroundMusic() {
  if (!musicEnabled || winnerTrackActive) return;

  try {
    await bgMusic.play();

    if (musicEnabled && !winnerTrackActive) {
      updateMusicButton(true, "YUTA soundtrack");
    }
  } catch {
    updateMusicButton(false, "Check background MP3");
  }
}

musicToggle.addEventListener("click", async () => {
  if (musicEnabled) {
    musicEnabled = false;
    musicGeneration++;
    bgMusic.pause();
    winnerMusic.pause();
    winnerTrackActive = false;
    updateMusicButton(false, "Music off");
    return;
  }

  musicEnabled = true;
  await playBackgroundMusic();
});

bgMusic.addEventListener("error", () => {
  updateMusicButton(false, "Check background MP3");
});

winnerMusic.addEventListener("error", () => {
  winnerTrackActive = false;
  updateMusicButton(false, "Check winner MP3");
});

winnerMusic.addEventListener("ended", () => {
  winnerTrackActive = false;

  if (musicEnabled) {
    bgMusic.currentTime = 0;
    playBackgroundMusic();
  } else {
    updateMusicButton(false, "Music off");
  }
});

async function playYutaWinnerMusic() {
  if (!musicEnabled) return;

  const generation = ++musicGeneration;
  winnerTrackActive = true;
  bgMusic.pause();
  winnerMusic.pause();
  winnerMusic.currentTime = 0;

  try {
    await winnerMusic.play();

    if (generation !== musicGeneration || !musicEnabled) {
      winnerMusic.pause();
      return;
    }

    updateMusicButton(true, "Winner theme");
  } catch {
    winnerTrackActive = false;

    if (musicEnabled) {
      updateMusicButton(false, "Winner audio unavailable");
      playBackgroundMusic();
    }
  }
}

// SONG SORTER
function shuffle(items) {
  const result = [...items];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

function setSongCard(button, song) {
  button.replaceChildren();

  const number = document.createElement("span");
  number.className = "song-number";
  number.textContent = "✦ YUTA SOLO";

  const title = document.createElement("span");
  title.className = "song-title";
  title.textContent = song;

  button.append(number, title);
  button.setAttribute("aria-label", "Choose " + song);

  const image = songImages[song];

  button.style.backgroundImage = image
    ? `linear-gradient(0deg,rgba(15,3,8,.88),rgba(35,5,14,.12)),url("${image}")`
    : "linear-gradient(135deg,#581727,#260b13)";
}

function start() {
  musicGeneration++;
  winnerTrackActive = false;
  winnerMusic.pause();
  winnerMusic.currentTime = 0;

  if (musicEnabled) {
    playBackgroundMusic();
  }

  ratings = {};
  appearances = {};

  songs.forEach(song => {
    ratings[song] = 1000;
    appearances[song] = 0;
  });

  match = 0;
  a = null;
  b = null;

  $("sorter").classList.remove("hidden");
  $("results").classList.add("hidden");

  next();
}

function next() {
  if (match >= TOTAL_MATCHUPS) {
    finish();
    return;
  }

  if (match < 10) {
    const pool = shuffle(songs);
    a = pool[0];
    b = pool.find(song => song !== a);
  } else {
    const leastSeen = Math.min(...Object.values(appearances));

    const available = shuffle(
      songs.filter(song => appearances[song] <= leastSeen + 1)
    );

    a = available[0];

    const opponents = songs
      .filter(song => song !== a)
      .sort((x, y) =>
        Math.abs(ratings[x] - ratings[a]) -
        Math.abs(ratings[y] - ratings[a])
      );

    const top = opponents.slice(0, 5);
    b = top[Math.floor(Math.random() * top.length)];
  }

  appearances[a]++;
  appearances[b]++;

  // These restore the two song-choice boxes.
  setSongCard($("a"), a);
  setSongCard($("b"), b);

  $("count").textContent = `Match ${match + 1} of ${TOTAL_MATCHUPS}`;

  const percent = Math.round(match / TOTAL_MATCHUPS * 100);
  $("percent").textContent = percent + "%";
  $("fill").style.width = percent + "%";
}

function choose(winner, loser) {
  const K = 40;

  const expectedWinner =
    1 / (1 + Math.pow(10, (ratings[loser] - ratings[winner]) / 400));

  const change = K * (1 - expectedWinner);

  ratings[winner] += change;
  ratings[loser] -= change;

  match++;
  next();
}

function finish() {
  const ranked = [...songs].sort((x, y) => ratings[y] - ratings[x]);
  const winner = ranked[0];

  $("sorter").classList.add("hidden");
  $("results").classList.remove("hidden");

  $("winnerSong").textContent = winner;
  $("winnerLink").href = youtubeLinks[winner] || "https://www.youtube.com/";

  const winnerImage = "assets/yuta-winner.jpg";
  $("winner-art").style.backgroundImage =
    `linear-gradient(0deg,rgba(33,6,14,.82),rgba(33,6,14,.12)),url("${winnerImage}")`;

  $("summary").textContent =
    `You completed ${TOTAL_MATCHUPS} matchups. Your winner is ${winner}! Your songs are ranked from #1 to #19.`;

  $("ranking").replaceChildren();

  ranked.forEach((song, index) => {
    const row = document.createElement("div");
    row.className = "rank";

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = index + 1;

    const art = document.createElement("span");
    art.className = "rank-art";
    art.setAttribute("aria-hidden", "true");

    if (songImages[song]) {
      art.style.backgroundImage =
        `linear-gradient(0deg,rgba(20,3,8,.18),rgba(20,3,8,.18)),url("${songImages[song]}")`;
    }

    const info = document.createElement("span");
    info.className = "rank-info";

    const title = document.createElement("span");
    title.className = "song";
    title.textContent = song;

    const caption = document.createElement("span");
    caption.className = "rank-caption";
    caption.textContent = index === 0 ? "✦ Your champion" : `Rank #${index + 1}`;

    info.append(title, caption);

    const rating = document.createElement("span");
    rating.className = "rating";
    rating.textContent = Math.round(ratings[song]) + " pts";

    row.append(num, art, info, rating);
    $("ranking").appendChild(row);
  });

  $("percent").textContent = "100%";
  $("fill").style.width = "100%";

  playYutaWinnerMusic();

  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
}

// BUTTONS
$("a").addEventListener("click", () => choose(a, b));
$("b").addEventListener("click", () => choose(b, a));
$("restart").addEventListener("click", start);

$("copy").addEventListener("click", async () => {
  const rows = [...document.querySelectorAll(".rank")]
    .map(row => {
      const number = row.querySelector(".num").textContent.trim();
      const song = row.querySelector(".song").textContent.trim();
      return `${number}. ${song}`;
    })
    .join("\n");

  const text = "My YUTA Solo Sort ranking:\n\n" + rows;

  try {
    await navigator.clipboard.writeText(text);
    $("copy").textContent = "Copied!";

    setTimeout(() => {
      $("copy").textContent = "Copy ranking";
    }, 2000);
  } catch {
    window.prompt("Copy your ranking:", text);
  }
});

// Start the game.
start();
</script>
